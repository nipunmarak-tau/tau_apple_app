# XcodeGen spec for Tau Research iOS.
# Generate with: xcodegen generate
name: TauResearch
options:
  bundleIdPrefix: com.tau
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # fill in for signing
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "6"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  TauResearch:
    type: application
    platform: iOS
    sources:
      - path: TauResearch
        excludes:
          - "Info.plist"
    resources:
      - path: TauResearch/Resources
    info:
      path: TauResearch/Info.plist
      properties:
        CFBundleDisplayName: Tau Research
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: BrandGreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        NSCameraUsageDescription: Tau Research needs the camera to record kiwifruit field scans.
        NSMicrophoneUsageDescription: Tau Research records audio alongside scan video for context.
        NSLocationWhenInUseUsageDescription: Tau Research records your GPS track during a scan.
        NSLocationAlwaysAndWhenInUseUsageDescription: Tau Research continues GPS logging while the app is in the background during a scan.
        NSPhotoLibraryAddUsageDescription: Tau Research can optionally save scan videos to your Photo Library.
        UIBackgroundModes:
          - audio
          - location
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.tau.research.upload
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tau.research
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandGreen
    dependencies: []
